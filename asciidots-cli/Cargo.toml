[package]
name = "asciidots-cli"
version = "0.1.0"
edition = "2024"

[features]
default = []
runtime-metrics = ["asciidots-core/runtime-metrics"]

[dependencies]
clap = { version = "4", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
asciidots-core = {path = "../asciidots-core/"}
asciidots-display-minifb = {path = "../asciidots-display-minifb/"}
rustc-hash = "2.1.1"
asciidots-tui = {path = "../asciidots-tui/"}
thiserror = "2.0.18"
env_logger = "0.11.9"
